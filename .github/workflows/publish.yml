name: publish

# A release of the theme platform (docs/releasing.md): a GitHub release published from a v<version> tag on master puts
# the four @entirius packages on npm and the three core images on ghcr.io, all at that version.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v7
      # The tag is v<version> of every package, or nothing goes out.
      - id: release
        run: node .github/scripts/release.mjs version "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

  npm:
    needs: version
    runs-on: ubuntu-latest
    # npm's trusted publisher names this repository, the workflow file publish.yml and the environment npm: no token
    # is stored anywhere, the job gets a short-lived one through OIDC and the packages carry provenance.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install --global npm@11
      - run: pnpm install --frozen-lockfile
      - run: node .github/scripts/release.mjs pack
      - name: publish
        env:
          DIST_TAG: ${{ needs.version.outputs.dist_tag }}
        run: |
          # ./ first: npm reads a bare dist/<name>.tgz as a GitHub repository.
          for tarball in ./dist/*.tgz; do
            npm publish "$tarball" --access public --tag "$DIST_TAG"
          done

  images:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [dev, builder, runtime]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Both architectures: theme authors work on Apple silicon as often as on x86. No `latest`: a shop names its
      # version in its Dockerfile.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/storefront.Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/entirius/storefront-${{ matrix.target }}:${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=MPL-2.0
