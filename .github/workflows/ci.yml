name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [master, develop]

# Read-only token for every job (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # JSON config imports (@/_CONFIG/*) must resolve before the build typechecks
      - run: cp -r _CONFIG.example _CONFIG
      - run: pnpm build

  # Types + ESLint. Legacy errors are listed in eslint-suppressions.json, so
  # only new ones fail; the warning count may not grow either.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp -r _CONFIG.example _CONFIG
      # Route types (e.g. RouteContext) that `next dev` / `next build` would generate.
      - run: pnpm exec next typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint --max-warnings=5

  # Unit tests (Vitest). E2E need the live backend and run locally (docs/testing.md).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp -r _CONFIG.example _CONFIG
      - run: pnpm test

  # MPL header in every source file — backstop for the local insert-license hook.
  license-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run insert-license --all-files

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          V=v8.30.0  # keep equal to the gitleaks rev in .pre-commit-config.yaml
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/${V}/gitleaks_${V#v}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks git --redact -v
